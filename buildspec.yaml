version: 0.2

env:
  exported-variables:
    - ARTIFACT_KEY

phases:
  install:
    runtime-versions:
      java: corretto25
    commands:
      - java -version
      - mvn --version

  pre_build:
    commands:
      - test -n "$ARTIFACT_BUCKET"
      - test -n "$COMMIT_ID"
      - export ARTIFACT_KEY="email-client-restapi/$COMMIT_ID.jar"

  build:
    commands:
      - mvn -B verify
      - aws s3 cp target/email-client-restapi-1.0.0.jar "s3://$ARTIFACT_BUCKET/$ARTIFACT_KEY"
