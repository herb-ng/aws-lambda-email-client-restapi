AWSTemplateFormatVersion: '2010-09-09'
Description: Email client backed by an AWS Lambda Function URL.

Parameters:
  ArtifactBucketName:
    Type: String
    Description: Name of the S3 bucket where the Lambda function artifact is stored.

Resources:
  EmailClientExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  EmailClientFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code: 
        S3Bucket: !Ref ArtifactBucketName
        S3Key: email-client-restapi-1.0.0.jar

      Handler: com.example.email.EmailClientHandler::handleRequest
      Runtime: java25
      MemorySize: 512
      Timeout: 15
      Role: !GetAtt EmailClientExecutionRole.Arn

  EmailClientFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt EmailClientFunction.Arn

  EmailClientFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref EmailClientFunction
      FunctionUrlAuthType: NONE
      InvokedViaFunctionUrl: true
      Principal: '*'

Outputs:
  FunctionUrl:
    Description: Lambda Function URL
    Value: !GetAtt EmailClientFunctionUrl.FunctionUrl