AWSTemplateFormatVersion: '2010-09-09'
Description: Email client backed by an AWS Lambda Function URL.

Parameters:
  ArtifactBucketName:
    Type: String
    Description: Name of the S3 bucket where the Lambda function artifact is stored.
  ArtifactKey:
    Type: String
    Default: email-client-restapi-1.0.0.jar
    Description: S3 key of the Lambda function artifact. Use a new key to deploy new code.
  InboxBucketName:
    Type: String
    Description: Name of the S3 bucket where SES stores inbound email.
  InboxReadPolicyArn:
    Type: String
    Description: ARN of the managed policy that allows reading the inbox.

Resources:
  EmailClientExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref InboxReadPolicyArn

  EmailClientFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code: 
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref ArtifactKey

      Handler: com.example.email.EmailClientHandler::handleRequest
      Runtime: java25
      MemorySize: 512
      Timeout: 15
      Role: !GetAtt EmailClientExecutionRole.Arn
      Environment:
        Variables:
          INBOX_BUCKET_NAME: !Ref InboxBucketName

  EmailClientFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt EmailClientFunction.Arn

  EmailClientFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref EmailClientFunction
      FunctionUrlAuthType: NONE
      Principal: '*'

  EmailClientFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EmailClientFunction
      InvokedViaFunctionUrl: true
      Principal: '*'

Outputs:
  FunctionUrl:
    Description: Lambda Function URL
    Value: !GetAtt EmailClientFunctionUrl.FunctionUrl