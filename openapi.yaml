openapi: 3.1.0
info:
  title: Email Client API
  version: 2.1.0
  description: >-
    Describes the API as it behaves today. Every request needs a valid API key
    in the x-api-key header, except GET requests for these docs. Other paths
    with a valid key return the status response for any method.
servers:
  - url: /
security:
  - apiKey: []
paths:
  /docs:
    get:
      operationId: getDocsPage
      summary: Get the Swagger UI page
      security: []
      responses:
        '200':
          description: The Swagger UI page.
          content:
            text/html:
              schema:
                type: string
  /docs/swagger-initializer.js:
    get:
      operationId: getDocsInitializer
      summary: Get the script that starts Swagger UI
      security: []
      responses:
        '200':
          description: The script.
          content:
            text/javascript:
              schema:
                type: string
  /docs/swagger-ui-bundle.js:
    get:
      operationId: getDocsScript
      summary: Get the Swagger UI script
      security: []
      responses:
        '200':
          description: The script.
          content:
            text/javascript:
              schema:
                type: string
  /docs/swagger-ui.css:
    get:
      operationId: getDocsStylesheet
      summary: Get the Swagger UI stylesheet
      security: []
      responses:
        '200':
          description: The stylesheet.
          content:
            text/css:
              schema:
                type: string
  /openapi.yaml:
    get:
      operationId: getOpenApi
      summary: Get this API description
      security: []
      responses:
        '200':
          description: This file.
          content:
            application/yaml:
              schema:
                type: string
  /:
    get:
      operationId: getStatus
      summary: Get the API status
      responses:
        '200':
          description: The API is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/VerificationFailed'
  /inbox:
    get:
      operationId: listInbox
      summary: List all received emails, newest first
      responses:
        '200':
          description: Every stored email. Emails with no valid date come last.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: The HTTP method is not allowed on this path.
          headers:
            Allow:
              description: The allowed method.
              schema:
                type: string
                const: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: >-
            The request could not be verified, the inbox could not be read, or
            the inbox is too large to return within the 6 MB size limit or 15
            second time limit. No partial list is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                verificationFailure:
                  value:
                    message: Could not verify the request
                readFailure:
                  value:
                    message: Could not read the inbox
                tooLarge:
                  value:
                    message: The inbox is too large to return
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
  responses:
    Unauthorized:
      description: The API key is missing or wrong.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            unauthorized:
              value:
                message: Unauthorized
    VerificationFailed:
      description: The request could not be verified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            verificationFailure:
              value:
                message: Could not verify the request
  schemas:
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          examples:
            - Email client API is running
    InboxResponse:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          items:
            $ref: '#/components/schemas/Email'
    Email:
      type: object
      description: A field that is missing or can't be parsed is null.
      required:
        - from
        - title
        - content
        - sentAt
      additionalProperties: false
      properties:
        from:
          type:
            - string
            - 'null'
          description: The From header, including any display name.
          examples:
            - Jane Doe <jane@example.com>
        title:
          type:
            - string
            - 'null'
          description: The email subject.
          examples:
            - Hello
        content:
          type:
            - string
            - 'null'
          description: >-
            The plain text body, or the unmodified HTML source when there is no
            plain text body. Clients that display HTML must sanitize it.
          examples:
            - Hi there.
        sentAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The Date header, in UTC.
          examples:
            - '2026-11-09T01:16:06Z'
